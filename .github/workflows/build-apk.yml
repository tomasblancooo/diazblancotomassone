name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter
        run: flutter --version

      - name: Crear proyecto Android base
        run: flutter create --org com.cybersec --project-name cybersec_crm --platforms android app

      - name: Copiar codigo y ajustar Android
        run: |
          mkdir -p app/lib/models app/lib/services app/lib/screens app/lib/widgets
          cp -f main.dart app/lib/main.dart
          cp -f cliente.dart app/lib/models/
          cp -f cliente_store.dart app/lib/services/
          cp -f confirm_dialog.dart risk_chip.dart app/lib/widgets/
          cp -f home_screen.dart lista_screen.dart cliente_form_screen.dart dashboard_screen.dart app/lib/screens/
          cd app
          dart ../patch_android.dart

      - name: Instalar dependencias
        working-directory: app
        run: |
          flutter pub add shared_preferences
          flutter pub get

      - name: Analizar el codigo
        working-directory: app
        continue-on-error: true
        run: flutter analyze

      - name: Compilar APK release
        working-directory: app
        run: flutter build apk --release

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberSec_CRM-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
