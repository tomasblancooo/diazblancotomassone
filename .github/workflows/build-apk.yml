name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter
        run: flutter --version

      - name: Crear proyecto Android base
        run: flutter create --org com.cybersec --project-name cybersec_crm --platforms android app

      - name: Copiar el codigo de la app
        run: |
          rm -rf app/lib
          cp -R lib app/lib

      - name: Ajustar Android
        working-directory: app
        run: dart ../tool/patch_android.dart

      - name: Instalar dependencias
        working-directory: app
        run: |
          flutter pub add shared_preferences
          flutter pub get

      - name: Analizar el codigo
        working-directory: app
        continue-on-error: true
        run: flutter analyze

      - name: Compilar APK release
        working-directory: app
        run: flutter build apk --release

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberSec_CRM-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
